[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../app/src/config" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

[invariant]
runs = 64
depth = 64
