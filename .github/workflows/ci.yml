name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge build --sizes
      - run: forge test -vv

  typescript:
    name: SDK, captain, app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Replay agent decisions without network or signer
        run: npm run verify:agent
      - name: Build the PWA against Arc testnet
        run: npm run build -w app
        env:
          NEXT_PUBLIC_CHAIN: arc

  e2e:
    name: E2E voyage (iPhone, local chain)
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Start local chain and deploy
        working-directory: app
        run: |
          npm run chain > chain.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Node running" chain.log && break; sleep 2; done
          tail -3 chain.log
      - run: npm run build -w app
      - run: npm run e2e -w app
